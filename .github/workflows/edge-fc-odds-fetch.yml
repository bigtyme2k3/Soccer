name: EDGE FC Odds Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: edge-fc-odds-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch EPL markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORT_KEY: soccer_epl
          ODDS_REGIONS: us
          ODDS_BOOKMAKERS: fanduel,draftkings,fanatics
        run: python scripts/fetch_epl_odds.py
      - name: Publish snapshot
        run: |
          git config user.name "EDGE FC Bot"
          git config user.email "actions@github.com"
          git add data/odds
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh EDGE FC EPL odds"
          git push

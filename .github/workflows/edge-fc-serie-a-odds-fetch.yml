name: EDGE FC Serie A Odds Fetch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edge-fc-serie-a-odds-fetch.yml'
      - 'scripts/fetch_soccer_odds.py'

permissions:
  contents: write

concurrency:
  group: edge-fc-serie-a-odds-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Serie A markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORT_KEY: soccer_italy_serie_a
          LEAGUE_SLUG: serie_a
          ODDS_REGIONS: us
          ODDS_BOOKMAKERS: fanduel,draftkings,fanatics
        run: python scripts/fetch_soccer_odds.py
      - name: Publish snapshot
        run: |
          git config user.name "EDGE FC Bot"
          git config user.email "actions@github.com"
          git add data/odds
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh EDGE FC Serie A odds"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
